name: stopcorn
description: "StopCorn, a private and judgment-free local self-help tool."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  drift: ^2.34.3
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^3.1.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  forui: ^0.25.0
  go_router: ^17.3.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  timezone: ^0.11.1
  uuid: ^4.6.0
  package_info_plus: ^10.2.1
  purchases_flutter: ^10.7.0
  purchases_ui_flutter: ^10.7.0
  url_launcher: ^6.3.2
  envied: ^1.3.8
  sentry_flutter: ^9.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  golden_screenshot: ^11.0.1
  riverpod_generator: ^4.0.0
  riverpod_lint: ^3.1.0
  shared_preferences_platform_interface: ^2.4.2
  envied_generator: ^1.3.8
  release: ^0.1.9

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/learning/
    - assets/learning/modules/

release:
  changelog:
    header: '# 📰 StopCorn changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
