name: Build and deploy website

on:
  push:
    branches:
      - main
      - master
    paths:
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/screenshots_test.dart
      - docs/**
      - assets/**
      - tool/**
      - .github/workflows/website.yml
  pull_request:
    branches:
      - main
      - master
    paths:
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/screenshots_test.dart
      - docs/**
      - assets/**
      - tool/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download published website media
        env:
          PUBLISHED_SITE_URL: https://stopcorn.skyost.eu
        shell: bash
        run: |
          set -euo pipefail

          locales=(de en es fr it pt)
          devices=(android/phone android/tablet ios/iphone ios/ipad)
          screenshots=(
            1_home.png
            2_urge_support.png
            3_progress.png
            4_journal.png
            5_learning.png
          )
          max_parallel_downloads=8
          active_downloads=0
          failed_downloads=0
          published_locales=()
          fallback_locales=()

          download_screenshot() {
            local locale="$1"
            local source_locale="$2"
            local device="$3"
            local screenshot="$4"
            local relative_path="screenshots/$locale/$device/$screenshot"
            local source_path="screenshots/$source_locale/$device/$screenshot"

            mkdir --parents "$(dirname "docs/public/$relative_path")"
            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --show-error \
              --silent \
              --output "docs/public/$relative_path" \
              "$PUBLISHED_SITE_URL/$source_path"
          }

          for locale in "${locales[@]}"; do
            if [[ "$locale" == en ]] || curl \
              --fail \
              --head \
              --location \
              --output /dev/null \
              --silent \
              "$PUBLISHED_SITE_URL/screenshots/$locale/ios/iphone/1_home.png"
            then
              published_locales+=("$locale")
            else
              fallback_locales+=("$locale")
              echo "::warning::No published screenshots found for '$locale'; using the English screenshots until the manual screenshot workflow is deployed."
            fi
          done

          for locale in "${published_locales[@]}"; do
            for device in "${devices[@]}"; do
              for screenshot in "${screenshots[@]}"; do
                download_screenshot \
                  "$locale" \
                  "$locale" \
                  "$device" \
                  "$screenshot" &
                active_downloads=$((active_downloads + 1))

                if ((active_downloads >= max_parallel_downloads)); then
                  if ! wait -n; then
                    failed_downloads=$((failed_downloads + 1))
                  fi
                  active_downloads=$((active_downloads - 1))
                fi
              done
            done
          done

          while ((active_downloads > 0)); do
            if ! wait -n; then
              failed_downloads=$((failed_downloads + 1))
            fi
            active_downloads=$((active_downloads - 1))
          done

          if ((failed_downloads > 0)); then
            echo "::error::$failed_downloads published screenshot download(s) failed."
            exit 1
          fi

          for locale in "${fallback_locales[@]}"; do
            mkdir --parents "docs/public/screenshots/$locale"
            cp --archive \
              docs/public/screenshots/en/. \
              "docs/public/screenshots/$locale/"
          done

          mkdir --parents docs/public/social
          for asset in social/open-graph.png social/twitter.png favicon.ico; do
            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-all-errors \
              --show-error \
              --silent \
              --output "docs/public/$asset" \
              "$PUBLISHED_SITE_URL/$asset"
          done

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22.19.0
          cache: true
          cache-dependency-path: docs/pnpm-lock.yaml
          package-json-file: docs/package.json
          install: false

      - name: Install dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Check and generate website
        run: pnpm --dir docs run check

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.output/public

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
