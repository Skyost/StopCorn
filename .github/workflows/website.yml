name: Build and deploy website

on:
  push:
    branches:
      - main
      - master
    paths:
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/screenshots_test.dart
      - docs/**
      - assets/**
      - tool/**
      - .github/workflows/website.yml
  pull_request:
    branches:
      - main
      - master
    paths:
      - pubspec.yaml
      - pubspec.lock
      - lib/**
      - test/screenshots_test.dart
      - docs/**
      - assets/**
      - tool/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install image-generation dependencies
        run: sudo apt-get update && sudo apt-get install --yes fontconfig imagemagick libpango-1.0-0

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate website media
        run: tool/website/generate.sh

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22.19.0
          cache: true
          cache-dependency-path: docs/pnpm-lock.yaml
          package-json-file: docs/package.json
          install: false

      - name: Install dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Check and generate website
        run: pnpm --dir docs run check

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.output/public

  deploy:
    name: Deploy website
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
